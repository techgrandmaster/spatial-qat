version: "3.9"

# Development overrides — compose with both files:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  backend:
    volumes:
      - ./backend:/app
      - ./data:/app/data
    # Runtime image has no `uv` binary — uvicorn ships in /app/.venv/bin.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spatial_qat
      - MODEL_API_KEY=${MODEL_API_KEY}
      - BUDGET_USD_HARD_CAP=${BUDGET_USD_HARD_CAP:-120.0}
      - MAX_IMAGE_SIZE_MB=${MAX_IMAGE_SIZE_MB:-10}
      - MAX_PDF_SIZE_MB=${MAX_PDF_SIZE_MB:-20}
      - MAX_AUDIO_SIZE_MB=${MAX_AUDIO_SIZE_MB:-10}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev -- --host
    environment:
      # Empty = same-origin /api (vite dev proxy forwards to localhost:8000).
      - VITE_API_URL=${VITE_API_URL:-}
